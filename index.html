<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9a3b2e">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>针灸学习知识库</title>
<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#2c2a26;--sub:#7a756b;--accent:#9a3b2e;--accent2:#3f6f5f;--line:#e6e1d6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.7 "Microsoft YaHei","PingFang SC",sans-serif;padding-bottom:70px}
header{position:sticky;top:0;z-index:9;background:rgba(247,244,238,.97);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;backdrop-filter:blur(6px)}
h1{font-size:17px}
h1 small{color:var(--sub);font-weight:normal;font-size:11px;margin-left:6px}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{flex:1;text-align:center;padding:8px 4px;border:1px solid var(--line);border-bottom:none;border-radius:9px 9px 0 0;background:#efece4;cursor:pointer;font-size:13.5px;color:var(--sub)}
.tab.on{background:var(--card);color:var(--accent);font-weight:bold}
main{max-width:860px;margin:0 auto;padding:12px 14px}
.panel{display:none}.panel.on{display:block}
.searchbar{display:flex;gap:8px;margin-bottom:9px}
#q{flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;background:#fff;outline:none}
.btn{background:var(--accent2);color:#fff;border:none;border-radius:9px;padding:10px 18px;font-size:14.5px}
.btn.red{background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;color:var(--sub)}
#stats{color:var(--sub);font-size:12.5px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:11px;position:relative}
.card h3{font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-right:40px}
.card h3 .pname{color:var(--accent)}
.badge{display:inline-block;font-size:11.5px;color:var(--accent2);background:#eef4f1;border-radius:6px;padding:1px 8px}
.kind{position:absolute;top:11px;right:12px;font-size:11px;color:var(--sub)}
.kind .del{color:#b55;cursor:pointer;margin-left:6px;text-decoration:underline}
.sec{margin-top:6px;font-size:14px}
.sec b{color:var(--accent);font-size:12.5px;margin-right:6px}
.ind li{margin:4px 0 4px 18px;font-size:13.5px}
.src{margin-top:8px;font-size:12px;color:var(--sub)}
.src a{color:var(--accent2);text-decoration:none;margin-right:10px}
input[type=text],textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:15px;background:#fff;font-family:inherit}
label{display:block;font-size:13px;color:var(--sub);margin:9px 0 4px}
label b{color:var(--accent)}
.tip{background:#fbf3e4;border:1px solid #eedfc0;border-radius:10px;padding:9px 13px;margin:9px 0;font-size:12.5px;color:#7a6231;line-height:1.8}
.ingres{background:#eef4f1;border-radius:10px;padding:10px 14px;margin-top:10px;font-size:13.5px}
.err{background:#f9e9e7;border-radius:10px;padding:10px 14px;margin-top:10px;color:var(--accent);font-size:13.5px}
.empty{padding:36px 0;text-align:center;color:var(--sub)}
mark{background:#f5e3a8;padding:0 1px}
.datarow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.datarow .btn{margin-top:0;flex:1;min-width:140px}
#installHint{display:none;background:#eef4f1;border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin-top:9px;font-size:12.5px;color:var(--accent2)}
</style>
</head>
<body>
<header>
  <h1>针灸学习知识库 <small>离线版 · <span id="stamp"></span></small></h1>
  <div class="tabs">
    <div class="tab on" data-p="kb">🔎 检索</div>
    <div class="tab" data-p="manual">✍️ 录入</div>
    <div class="tab" data-p="data">💾 数据</div>
  </div>
</header>
<main>
<div class="panel on" id="p-kb">
  <div class="searchbar"><input id="q" type="search" placeholder="疾病 / 症状 / 穴位 / 经络…"></div>
  <div class="chips" id="chips"></div>
  <div id="stats" class="loading">加载中…</div>
  <div id="installHint">💡 用浏览器菜单里的「添加到主屏幕 / 安装应用」，即可像 App 一样全屏离线使用。</div>
  <div id="results"></div>
</div>
<div class="panel" id="p-manual">
  <div class="tip">录入后保存在<b>本机</b>，离线可查；可在「数据」页导出文件同步回电脑。</div>
  <label><b>穴位名 / 主穴</b>（必填）</label><input type="text" id="m-point" placeholder="例：间使 + 内关">
  <label>经络 / 体系</label><input type="text" id="m-meridian">
  <label>📍 定位</label><textarea id="m-location" rows="2"></textarea>
  <label>🖐 手法</label><input type="text" id="m-technique">
  <label>💊 功效</label><input type="text" id="m-effects">
  <label>🧩 主治 / 病症（顿号分隔，搜索关键词）</label><textarea id="m-indications" rows="2"></textarea>
  <label>📝 备注</label><textarea id="m-notes" rows="2"></textarea>
  <button class="btn" id="msave" style="width:100%">保存到本机</button>
  <div id="mout"></div>
</div>
<div class="panel" id="p-data">
  <div class="tip">本机数据 = 内置 <span id="seedN"></span> 条 + 本机新增 <span id="localN"></span> 条。<br>「导出本机新增」生成 JSON 文件，发给电脑端导入即可双向同步。</div>
  <div class="datarow">
    <button class="btn" id="exportBtn">📤 导出本机新增</button>
    <button class="btn" id="importBtn" style="background:var(--gold,#b98a2f)">📥 导入数据文件</button>
    <button class="btn" id="wipeBtn" style="background:#888">清空本机新增</button>
  </div>
  <input type="file" id="importFile" accept=".json" style="display:none">
  <div id="dout"></div>
</div>
</main>

  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + t.dataset.p));
});

// ---- 录入（词典自动补全）----
$('#m-point').addEventListener('blur', () => {
  const first = $('#m-point').value.trim().split(/[+＋、,，]/)[0].trim().replace(/穴$/,'');
  if(!first) return;
  const hit = DICT.find(d => d.name === first || (d.aliases||[]).includes(first));
  if(hit){
    if(!$('#m-location').value) $('#m-location').value = hit.location || '';
    if(!$('#m-effects').value) $('#m-effects').value = hit.effects || '';
    if(!$('#m-meridian').value) $('#m-meridian').value = hit.meridian || '';
  }
});
$('#msave').onclick = () => {
  const point = $('#m-point').value.trim();
  if(!point){ $('#mout').innerHTML = '<div class="err">穴位名必填</div>'; return; }
  const indications = $('#m-indications').value.split(/[、,，;；\n]+/).map(s=>s.trim()).filter(Boolean);
  const arr = localEntries();
  arr.push({id: 'phone-' + Date.now(), kind: 'phone', point,
    meridian: $('#m-meridian').value.trim(), location: $('#m-location').value.trim(),
    technique: $('#m-technique').value.trim(), effects: $('#m-effects').value.trim(),
    indications, notes: $('#m-notes').value.trim(), source: {type: 'phone'}});
  saveLocal(arr);
  ['m-point','m-meridian','m-location','m-technique','m-effects','m-indications','m-notes'].forEach(i => $('#'+i).value='');
  $('#mout').innerHTML = '<div class="ingres">✅ 已保存到本机（离线可查）。可在「数据」页导出同步回电脑。</div>';
  render(); refreshCounts();
};

// ---- 数据页：导出/导入 ----
function refreshCounts(){
  $('#seedN').textContent = (JSON.parse(localStorage.getItem('zk_seed')||'[]')).length;
  $('#localN').textContent = localEntries().length;
}
$('#exportBtn').onclick = () => {
  const data = {exported_at: new Date().toLocaleString(), device: 'phone', entries: localEntries()};
  const blob = new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '针灸手册-本机新增-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').addEventListener('change', ev => {
  const f = ev.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      const items = Array.isArray(d) ? d : (d.entries || []);
      const arr = localEntries();
      const have = new Set(allEntries().map(e => e.id));
      let added = 0;
      for(const e of items){
        if(!e || !e.id || !e.point || have.has(e.id)) continue;
        e.kind = e.kind || 'phone';
        arr.push(e); have.add(e.id); added++;
      }
      saveLocal(arr); refreshCounts(); render();
      $('#dout').innerHTML = `<div class="ingres">✅ 导入完成，新增 ${added} 条</div>`;
    }catch(err){ $('#dout').innerHTML = `<div class="err">❌ 文件解析失败：${err.message}</div>`; }
  };
  rd.readAsText(f, 'utf-8');
});
$('#wipeBtn').onclick = () => {
  if(!localEntries().length){ $('#dout').innerHTML = '<div class="ingres">本机没有新增记录。</div>'; return; }
  if(confirm('确定清空本机新增的 ' + localEntries().length + ' 条记录？（内置数据不受影响）')){
    saveLocal([]); refreshCounts(); render();
    $('#dout').innerHTML = '<div class="ingres">已清空本机新增。</div>';
  }
};

// ---- PWA ----
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
seedSync();
$('#stamp').textContent = STAMP;
refreshCounts();
render();
</script>

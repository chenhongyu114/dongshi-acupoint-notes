const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let curQuery = "";

function highlight(text, terms){
  let out = esc(text);
  for(const t of terms){
    if(!t) continue;
    out = out.replace(new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");
  }
  return out;
}

const SYNONYMS = {"高血压":["降血压","降压"],"牙疼":["牙痛"],"腰疼":["腰痛"],"膝盖疼":["膝关节","膝"],"胃疼":["胃痛","胃病"],"感冒":["外感"],"耳鸣":["耳聋"],"糖尿病":["消渴"]};

function match(g, terms){
  if(!terms.length) return true;
  const hay = g.search.toLowerCase();
  return terms.every(t => {
    const alts = [t, ...(SYNONYMS[t] || [])].map(x => x.toLowerCase());
    return alts.some(s => hay.includes(s));
  });
}

  return `<div class="card">
    <h2><span class="pname">${highlight(g.point,terms)}</span><span class="meri">${esc(g.meridian)}</span></h2>
    <div class="sec"><b>📍 取穴</b><span class="loc">${highlight(g.location,terms)}</span></div>
    <div class="sec"><b>🖐 手法</b><span class="loc">${highlight(g.technique||"—",terms)}</span></div>
    <div class="sec"><b>🧩 配穴应用</b><ul class="combos">${combos}</ul></div>
    <div class="eps">来源：${eps}</div>
  </div>`;
}

function render(){
  const terms = curQuery.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = DATA.filter(g => match(g, terms));
  $("#stats").textContent = hits.length ? `共 ${hits.length} 个穴位/针组匹配“${curQuery.trim()}”` : "";
  $("#results").innerHTML = hits.length
    ? hits.map(g => cardHTML(g, terms)).join("")
    : `<div class="empty">没有匹配的内容，换个关键词试试（如：失眠、胃疼、颈椎、痛经…）</div>`;
}

function setQuery(q){
  curQuery = q.trim();
  $("#q").value = curQuery;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.q === curQuery));
  render();
  window.scrollTo({top: 0});
}

$("#q").addEventListener("input", e => setQuery(e.target.value));
$("#clear").addEventListener("click", () => setQuery(""));
$("#chips").innerHTML = CHIPS.map(c=>`<span class="chip" data-q="${c}">${c}</span>`).join("");
$("#chips").addEventListener("click", e => {
  const c = e.target.closest(".chip");
  if(c) setQuery(c.dataset.q === curQuery ? "" : c.dataset.q);
});
render();
</script>
</body>
</html>
